name: rfc0029-differential

# Permanent differential conformance gate for RFC 0029 / RFC 0029.a: on every
# change to the symbolic fixture source, the canonical generator/schema, the
# Rust conformance crate, or the independent Ruby implementation, this job
# regenerates the canonical corpus (validating every vector against
# schema.json, the normative grammar), runs the Rust test suite, and runs the
# second, independently-built Ruby implementation against the same fixture
# corpus -- failing the build on any schema violation, canonicalization
# mismatch, or semantic disagreement outside the one disclosed, tracked
# exception (rfcs/evidence/0029/independent-implementation/report.md
# §3/§4/§8). Fixture count grows over time; see manifest.json for the
# current total rather than trusting a number in this comment.
#
# This does not replace `build.yml`'s workspace-wide `cargo test`, which
# already runs crates/rfc0029-conformance's own suite; this job's purpose is
# specifically the cross-implementation comparison neither of the two
# implementations can perform on itself.

on:
  push:
    branches: [main]
    paths:
      - "rfcs/fixtures/0029-influence-review-symbolic.yaml"
      - "rfcs/fixtures/0029-canonical/**"
      - "rfcs/0029-domain-neutral-policy-enforcement.md"
      - "rfcs/0029.a-model-assurance-port.md"
      - "crates/rfc0029-conformance/**"
      - "independent-implementations/rfc0029-ruby/**"
      - ".github/workflows/rfc0029-differential.yml"
  pull_request:
    branches: [main]
    paths:
      - "rfcs/fixtures/0029-influence-review-symbolic.yaml"
      - "rfcs/fixtures/0029-canonical/**"
      - "rfcs/0029-domain-neutral-policy-enforcement.md"
      - "rfcs/0029.a-model-assurance-port.md"
      - "crates/rfc0029-conformance/**"
      - "independent-implementations/rfc0029-ruby/**"
      - ".github/workflows/rfc0029-differential.yml"

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install fixture generator's dependencies
        run: pip install pyyaml jsonschema
      - name: Regenerate canonical fixtures, validate against schema.json, and check byte-for-byte stability
        run: python3 rfcs/fixtures/0029-canonical/generate.py --check

      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rfc0029-${{ hashFiles('Cargo.lock') }}
      - name: Test the Rust conformance crate
        run: cargo test -p rfc0029-conformance

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Run the independent Ruby implementation's differential gate
        working-directory: independent-implementations/rfc0029-ruby
        run: ruby verify.rb

      - name: Upload machine-readable differential result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfc0029-differential-run-output
          path: independent-implementations/rfc0029-ruby/run_output.json
