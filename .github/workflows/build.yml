name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # crates/compiler (and its dedicated build/build-macos/build-windows jobs,
  # which existed solely to build/test that crate) was deleted 2026-09-20 --
  # deprecated in favor of the v2 Rust dialect, see docs/ROADMAP.md's
  # 2026-09-17 note and docs/V2_MIGRATION_ROADMAP.md. This job replaces them
  # with real coverage of the rest of the workspace, which previously had
  # none here (only v2-guarantees.yml's narrow, crate-specific checks).
  #
  # No system dependencies installed here on purpose, not by oversight:
  # the GTK3/WebKitGTK install this job used to need was for `wry`/`tao`
  # (nirdosha-hi's now-deleted native-window feature, removed the same
  # session); no remaining root-workspace crate needed a system `libz3`
  # install even for the old compiler-testing job's Linux leg once that
  # crate is gone -- confirmed by this exact `cargo build --workspace`
  # succeeding locally with no such install, and by v2-guarantees.yml's
  # own jobs (nirdosha-driver, nirdosha-contract-core, etc.) never
  # installing one either. Add one back if a real CI failure says otherwise
  # -- don't guess ahead of evidence.
  #
  # No Redis service container either: the old job's own comment named
  # its one real consumer, crates/compiler/tests/codegen.rs's
  # `mq_publish_and_consume_round_trip_a_real_message`, deleted alongside
  # that crate. The one other real-Redis test in this workspace,
  # `crates/nirdosha-rt/tests/fleet_rate_limit.rs`, is `#[ignore]`d and
  # feature-gated (`fleet-rate-limit`, non-default) by its own design;
  # `examples/nirdosha-v2-corpus/tests/outputs.rs`'s notification test
  # stands up its own fake RESP-speaking TCP listener rather than needing
  # a real Redis at all. Nothing in a default `cargo test --workspace`
  # run needs one.
  #
  # `--exclude rtm`: examples/rtm is a real workspace member with an empty
  # `src/` (a work-in-progress example, pre-existing, unrelated to this
  # change) -- its `[[bin]]` target has no source file yet, so it fails
  # target resolution before any code is even compiled.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build the workspace
        run: cargo build --workspace --exclude rtm
      - name: Test the workspace
        run: cargo test --workspace --exclude rtm
