name: docker

# Publishes ghcr.io/protobox/nirdosha-presence-gateway
# (`crates/presence-gateway/`, docs/ROADMAP.md Track A5's own image).
#
# `ghcr.io/protobox/nirdosha-runtime` (the native `.nir` compiler's
# runtime image, `crates/compiler`) and `release.yml` (its raw binary
# releases) are RETIRED — `crates/compiler` is deprecated in favor of
# the v2 Rust dialect (`cargo-nirdosha`/`nirdosha-rt`/`nirdosha-driver`),
# which has no equivalent packaged release yet. This workflow used to
# matrix both images over one shared job (every step past "which
# Dockerfile/image name" was identical); now that only one image
# remains, it's a plain single-image job instead of a one-entry matrix.
#
# Multi-arch (amd64/arm64) via a single `docker buildx build --platform`
# invocation, using QEMU emulation for the arm64 leg.
#
# Signed (cosign, keyless via GitHub OIDC — no key material to manage or
# leak) and SBOM'd (syft, attached as an attestation) on every publish —
# docs/KUBERNETES.md's "SBOM / image signing (Sigstore, SLSA)" row.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

env:
  IMAGE: ghcr.io/protobox/nirdosha-presence-gateway
  SBOM_FILE: nirdosha-presence-gateway.sbom.spdx.json

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for the arm64 leg)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == v* ]]; then
            echo "tags=${IMAGE}:${ref},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # `crates/presence-gateway/Dockerfile` needs the repo root as
          # its build context: it also `COPY`s `crates/compiler/`'s
          # manifest for its `[dev-dependencies]` path resolution (that
          # Dockerfile's own doc comment), not just
          # `crates/presence-gateway/` itself.
          context: .
          file: crates/presence-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Referenced by digest for signing/SBOM below, so both attach
          # to the exact manifest list that was actually pushed, not a
          # tag that could move.
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image (keyless, Sigstore/Fulcio+Rekor)
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM (syft) and attach as an attestation
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}

      - name: Attest the SBOM to the published image (cosign)
        run: |
          cosign attest --yes --predicate "${SBOM_FILE}" --type spdxjson "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Upload SBOM as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nirdosha-presence-gateway-sbom
          path: ${{ env.SBOM_FILE }}
