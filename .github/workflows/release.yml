name: release

# Builds prebuilt `nirdosha` binaries and attaches them to a GitHub
# Release whenever a `v*` tag is pushed. Z3 is statically vendored (the
# `dist` feature, see crates/compiler/Cargo.toml) on Linux/Windows, so those
# binaries need no system `libz3` — `clang` is still required on the
# *user's* machine at runtime, for `nirdosha build`/`emit-llvm` (native
# codegen), which is now the only way to execute a `.nir` program at all
# (the interpreter, and `run`/`serve`, were removed); `emit-ast`/`emit-ui`
# work with zero extra system deps.
#
# macOS is the one disclosed exception: `z3-src` 416.0.2 (the version
# the current `z3` 0.20.2 crate pulls) fails to compile against the
# AppleClang shipped on GitHub's macOS runners (a real upstream
# `obj_hashtable.h` constructor-strictness incompatibility, confirmed
# 2026-08-25 on this workflow's first real run — not a config mistake).
# Until a newer `z3`/`z3-src` release fixes this upstream, macOS builds
# link the *system* Z3 (via Homebrew) instead of vendoring it — so the
# macOS binary needs `brew install z3` on the machine that runs it, same
# as building from source would. Documented, not silent.
#
# Linux builds on `ubuntu-22.04`, not `ubuntu-latest` (= 24.04): found
# by a real cold-machine install rehearsal (2026-09-11) -- a binary
# built on 24.04 needs GLIBC_2.39/GLIBCXX_3.4.31 to even start, which a
# plain `debian:bookworm-slim` container (glibc 2.36, a real "cold
# machine" stand-in) doesn't have ("version `GLIBC_2.39' not found").
# 22.04's older toolchain lowers that floor to glibc 2.35, covering
# Debian 12/Ubuntu 22.04+/RHEL 9 -- still not RHEL 8/Debian
# 11/Amazon Linux 2 (glibc <2.35), which would need a fully static
# `x86_64-unknown-linux-musl` build to cover; not attempted in this
# pass, a real disclosed gap (`docs/PUBLIC_ROADMAP.md`), not a silent one.
#
# `x86_64-apple-darwin` runs on `macos-15-intel`, not `macos-13`: found
# by a real stuck v0.1.0 release run (2026-09-11) where that matrix leg
# sat `queued` with no runner ever assigned while the other three legs
# ran normally within seconds — GitHub retired the `macos-13` hosted
# runner image entirely on 2025-12-08
# (https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/),
# and `macos-15-intel` is the label GitHub introduced specifically to
# replace it for Intel-Mac builds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: nirdosha-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            asset: nirdosha-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            asset: nirdosha-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: nirdosha-x86_64-pc-windows-msvc.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install system Z3 (macOS only — see workflow header)
        if: runner.os == 'macOS'
        run: brew install z3

      # Same GTK/WebKitGTK dev-headers requirement `build.yml`'s Linux
      # job needs (see that workflow's own comment) -- `wry`'s Linux
      # backend, new as of the `hi` build-mode window, embeds WebKitGTK.
      # macOS/Windows need nothing extra here (WKWebView/WebView2 are
      # system frameworks already present on those runners).
      - name: Install system dependencies (gtk/webkit2gtk for the hi build-mode window — Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build (Z3 vendored, no system libz3 dependency)
        if: runner.os != 'macOS'
        working-directory: crates/compiler
        run: cargo build --release --features dist --target ${{ matrix.target }}

      - name: Build (macOS — system Z3, see workflow header)
        if: runner.os == 'macOS'
        working-directory: crates/compiler
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assemble Nirdosha.app (macOS icon/file-association registrar)
        # Only once, not once per macOS arch matrix leg — see
        # assets/macos/Nirdosha.app/Contents/Info.plist's own comment for
        # why this needs a real app bundle at all, and why `iconutil`/`cc`
        # (native-macOS-only, unavailable in a Linux dev sandbox) are the
        # reason this step lives here instead of being committed pre-built.
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -eu
          bundle=Nirdosha.app
          rm -rf "$bundle"
          cp -R assets/macos/Nirdosha.app "$bundle"
          mkdir -p "$bundle/Contents/Resources"
          iconutil -c icns assets/brand/nirdosha.iconset -o "$bundle/Contents/Resources/nirdosha.icns"
          cc -O2 -o "$bundle/Contents/MacOS/nirdosha-launcher" assets/macos/nirdosha-launcher.c
          chmod +x "$bundle/Contents/MacOS/nirdosha-launcher"
          plutil -lint "$bundle/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" nirdosha-icon-registrar-macos.zip
          shasum -a 256 nirdosha-icon-registrar-macos.zip > nirdosha-icon-registrar-macos.zip.sha256

      - name: Package (Unix)
        # Linux tarballs also carry the icon-theme PNGs + shared-mime-info
        # XML (assets/linux/, assets/brand/linux-icons/) so
        # scripts/install.sh's Linux branch can register the .nir file
        # icon from what it already downloaded — the curl-one-liner
        # install never clones this repo, so anything install.sh needs at
        # install time has to ship IN the release asset, not just live in
        # git. macOS gets no extra payload here — see the separate
        # Nirdosha.app registrar asset/step above for how macOS gets its
        # icon association instead (a different mechanism entirely,
        # Launch Services, not an icon-theme directory).
        if: runner.os != 'Windows'
        working-directory: crates/compiler
        run: |
          stage=$(mktemp -d)
          cp ../../target/${{ matrix.target }}/release/nirdosha "$stage/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp -r ../../assets/brand/linux-icons "$stage/linux-icons"
            cp ../../assets/linux/nirdosha-mime.xml "$stage/nirdosha-mime.xml"
          fi
          tar czf ../../${{ matrix.asset }} -C "$stage" .
          rm -rf "$stage"
          cd ../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi

      - name: Package (Windows)
        # Bundles nirdosha.ico alongside nirdosha.exe so
        # scripts/install.ps1 can register the .nir file icon from what
        # it already downloaded — same "install.ps1 never clones this
        # repo" reasoning as the Unix step above.
        if: runner.os == 'Windows'
        working-directory: crates/compiler
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:TEMP "nirdosha-pkg-$([guid]::NewGuid())")
          Copy-Item ../../target/${{ matrix.target }}/release/nirdosha.exe $stage
          Copy-Item ../../assets/brand/nirdosha.ico $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath ../../${{ matrix.asset }}
          Remove-Item -Recurse -Force $stage
          cd ../..
          Get-FileHash ${{ matrix.asset }} -Algorithm SHA256 | Select-Object -ExpandProperty Hash | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Smoke test the built binary
        # No interpreter/`run` mode anymore -- `build` a real native
        # binary from the fixture, then execute *that*, matching
        # `tests/codegen.rs::hello_compiles_and_matches_interpreter`'s
        # own expectation (main prints `add(5, 3)` = 8, exits 0).
        if: runner.os != 'Windows'
        run: |
          chmod +x target/${{ matrix.target }}/release/nirdosha
          target/${{ matrix.target }}/release/nirdosha build crates/compiler/tests/fixtures/hello.nir -o /tmp/nirdosha_smoke_test
          output="$(/tmp/nirdosha_smoke_test)"
          test "$output" = "8"

      # Same-machine smoke test above can't catch a glibc-version
      # mismatch (the runner that built it always has its own glibc
      # available). This is a real cold-machine rehearsal instead: run
      # the just-built binary inside a plain `debian:bookworm-slim`
      # container (older glibc, no repo/toolchain, nothing pre-staged)
      # -- exactly the check that caught the `ubuntu-latest` ->
      # `ubuntu-22.04` glibc-floor bug this workflow now carries a fix
      # for, kept here so a future toolchain bump can't silently
      # reintroduce it.
      - name: Cold-machine rehearsal (Linux only — older-glibc container, no clang/build tools)
        # Deliberately just `--help`, not `build`: this step isolates
        # the binary's own dynamic-linking requirement (glibc/glibcxx
        # version) from `nirdosha build`'s separate, documented
        # requirement that the *user's* machine has `clang` installed --
        # conflating the two would make a missing-clang failure here
        # look like the glibc regression this step exists to catch.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release/nirdosha:/nirdosha:ro" debian:bookworm-slim /nirdosha --help

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

      - name: Upload Nirdosha.app (icon/file-association registrar)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nirdosha-icon-registrar-macos.zip
            nirdosha-icon-registrar-macos.zip.sha256
