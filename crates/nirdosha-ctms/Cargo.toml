[package]
name = "nirdosha-ctms"
version = "0.1.0"
edition = "2021"
publish = false
description = "RFC 0029 continuous transaction monitoring (CTMS): canonical event schema, a demo-mode Kafka-compatible stream adapter, a deterministic velocity rule, and the alert.create/case.assign/case.disposition effect gateways. First slice of docs' CTMS design note -- see src/lib.rs for exact scope."

[dependencies]
nirdosha-rt = { path = "../nirdosha-rt" }
nirdosha-audit = { path = "../nirdosha-audit" }
nirdosha-guard-rfc0029 = { path = "../nirdosha-guard-rfc0029" }
nirdosha-ingestion-topic-kafka = { path = "../nirdosha-ingestion-topic-kafka" }
nirdosha-scoring-model-onnx = { path = "../nirdosha-scoring-model-onnx" }
nirdosha-egress-report-goaml = { path = "../nirdosha-egress-report-goaml" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
