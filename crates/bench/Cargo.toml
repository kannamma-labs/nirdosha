[package]
name = "nirdosha-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "nirdosha-master-plan.md Part 3 Sprint 2's benchmark harness v1 -- pass@1 and self-repair-rate over a real LLM, scored by nirdosha certify's own JSON verdict."

[dependencies]
# `hi_llm.rs` (and everything it needs) moved to the standalone
# `nirdosha-hi` crate 2026-09-16 -- this harness only ever used
# `nirdosha::hi_llm`, never the native compiler crate directly.
# `nirdosha-hi`'s `native-window` feature (`wry`/`tao`, and
# transitively the entire GTK3/WebKitGTK stack) was removed outright
# 2026-09-20 in favor of an app-mode browser window
# (rfcs/0014-generative-build-console.md's amendment) -- no
# `default-features = false` needed here anymore, there's nothing left
# to opt out of.
nirdosha-hi = { path = "../nirdosha-hi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
