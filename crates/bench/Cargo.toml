[package]
name = "nirdosha-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "nirdosha-master-plan.md Part 3 Sprint 2's benchmark harness v1 -- pass@1 and self-repair-rate over a real LLM, scored by nirdosha certify's own JSON verdict."

[dependencies]
# `hi_llm.rs` (and everything it needs) moved to the standalone
# `nirdosha-hi` crate 2026-09-16 -- this harness only ever used
# `nirdosha::hi_llm`, never the native compiler crate directly.
# `default-features = false`: this harness never touches `hi_window.rs`
# (grep confirms only `hi_llm` is ever imported), so there's no reason
# to also build `nirdosha-hi`'s default `native-window` feature (`wry`/
# `tao`, and transitively the entire GTK3/WebKitGTK/soup3/javascriptcore/
# dbus/x11 stack) just to run this benchmark harness.
nirdosha-hi = { path = "../nirdosha-hi", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
