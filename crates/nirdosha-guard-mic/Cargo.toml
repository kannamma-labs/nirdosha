[package]
name = "nirdosha-guard-mic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nirdosha-guard-core = { path = "../nirdosha-guard-core" }
nirdosha-guard-federation = { path = "../nirdosha-guard-federation" }
nirdosha-guard-registry = { path = "../nirdosha-guard-registry" }
nirdosha-audit = { path = "../nirdosha-audit" }
nirdosha-lineage = { path = "../nirdosha-lineage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# Opaque cursor tokens (I10/§8.4: "opaque cursors only; offset rejected")
# -- base64-encoding the underlying keyset position keeps it a token to
# pass back, not a value a caller is meant to construct or interpret.
base64 = "0.22"
