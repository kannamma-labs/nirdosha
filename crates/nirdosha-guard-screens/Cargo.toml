[package]
name = "nirdosha-guard-screens"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bridges nirdosha-guard-mic's GuardClient/StoreDriver plane into nirdosha-rt's screen-archetype macros (crud_screens!, dashboard!, ...) -- see Phase 0/A of the RTM live-demo plan for why this is a separate crate, not a SharedTable adapter."

[dependencies]
nirdosha-guard-core = { path = "../nirdosha-guard-core" }
nirdosha-guard-mic = { path = "../nirdosha-guard-mic" }
nirdosha-guard-registry = { path = "../nirdosha-guard-registry" }
nirdosha-audit = { path = "../nirdosha-audit" }
nirdosha-rt = { path = "../nirdosha-rt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
