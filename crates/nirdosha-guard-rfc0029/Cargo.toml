[package]
name = "nirdosha-guard-rfc0029"
version = "0.1.0"
edition = "2021"
publish = false
description = "RFC 0029 §7.1 runtime capability + effect gateway for the service-catalog vertical slice. Deliberately separate from crates/rfc0029-conformance, which has no real gateway and cannot authorize a production effect on its own terms."

[dependencies]
nirdosha-rt = { path = "../nirdosha-rt" }
nirdosha-audit = { path = "../nirdosha-audit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
