# Deliberately its own workspace root (empty `[workspace]` table below),
# not a member of the top-level nirdosha workspace: this is a reference/
# demo crate meant to be *copied out* into another TUI app (see README),
# not built or shipped as part of the compiler/runtime. Joining the real
# workspace would force a single shared Cargo.lock resolve across every
# crate here, including some with no relation to this one at all -- and
# was tried; it failed on a pre-existing, unrelated version conflict
# between `jsonwebtoken` (-> js-sys 0.3.77, via presence-gateway) and
# `tokio-postgres` (-> whoami -> web-sys 0.3.85, via the compiler's
# Postgres support), not introduced by this crate and out of scope to
# fix here. Standing alone avoids that collision entirely.
[workspace]

[package]
name = "nirdosha-tui-logo-splash"
version = "0.1.0"
edition = "2021"
description = "Animated nirdosha logo for terminal apps: half-block pixel-art sampled from assets/brand/nirdosha-logo.png, drawn as a ratatui widget (reveal -> type-in -> idle breathe). Reference/demo crate: `cargo run --release` previews it standalone; `src/logo_anim.rs` + `src/logo_pixels.rs` are meant to be copied into any ratatui TUI that wants the same splash."

[[bin]]
name = "nirdosha-tui-logo-splash"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
