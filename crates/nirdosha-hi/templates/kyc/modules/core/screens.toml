[metadata]
schema = "nirdosha.screen-register/v2"
register_id = "kyc"
version = "1.0.0"
source_inventory = "examples/kyc/screen.md"
total_screens = 32
module = "kyc-core"
canonical_order = "module_then_id"
codegen_profile = "web-default"
generator_version = "nirdosha-screen-codegen/1"
default_timezone = "UTC"
default_locale = "en-IN"

# App-wide approval chains consumed by approval_inbox sources.
[[approval_chain]]
name = "document_review"
quorum = 1
approvers = ["kyc_analyst", "kyc_senior_analyst"]

[[approval_chain]]
name = "screening_hit_review"
quorum = 2
approvers = ["kyc_senior_analyst", "kyc_mlro"]

[[approval_chain]]
name = "case_review"
quorum = 1
approvers = ["kyc_analyst", "kyc_senior_analyst"]

[[approval_chain]]
name = "case_escalation"
quorum = 1
approvers = ["kyc_mlro"]

# ─────────────────────────────────────────────────────────────────────
# M01 — Auth & Shell
# ─────────────────────────────────────────────────────────────────────

[[screen]]
id = "1.1"
name = "Login"
module = "M01"
archetype = "login"
stage = "built"
roles = ["AllRoles:R"]
datasets = ["KYC.identity_store"]
blocked_by = []

[screen.codegen]
template = "auth/login"
mount_symbol = "mount_login"
renderer = "web"
artifact_namespace = "kyc.m01.login"
generated_files = ["src/screens/m01_auth.nir"]
route_path = "/login"
route_owner = "M01"

[screen.parameters]
mode = "sso"
demo_users = [
    { username = "alice", password = "pass123", roles = ["Customer"] },
    { username = "bob",   password = "pass123", roles = ["Customer", "LoanOfficer"] },
    { username = "carol", password = "pass123", roles = ["BranchManager"] },
    { username = "dave",  password = "pass123", roles = ["TreasuryHead"] },
    { username = "eve",   password = "pass123", roles = ["ComplianceOfficer"] },
]
notes = "demo auth; production mode needs OIDC/JWKS wiring"
    

[screen.policy]
policy_ids = ["KYC-AUTH-01"]
purpose = "authenticate_user"
allowed_actions = ["read", "propose", "confirm"]
subject_scope = "self"
segregation_class = "identity-boundary"

[screen.logging]
domain = "identity"
country = "*"
entity = "LoginSession"
event_class = "access"
level = "notice"
policy_id = "LOG-IDENTITY-01"
required_fields = ["screen_id", "actor_id", "correlation_id"]
redaction_profile = "identity-minimal"

[[screen.dependencies]]
kind = "policy"
name = "KYC-AUTH-01"
version = "1"
hash = "sha256:1111111111111111111111111111111111111111111111111111111111111111"
required = true

[screen.provenance]
owner = "identity-platform"
reviewers = ["security", "compliance"]
change_ticket = "KYC-1001"
last_verified_revision = "git:aaaaaaa"

[screen.render_profile]
theme = "nirdosha-default"
density = "comfortable"
responsive = true
accessibility_level = "AA"
supports_streaming = false
supports_offline = false

[screen.determinism]
ordering_key = "module,id"
seed = 0
fixture_namespace = "kyc.m01.login"
stable_id = "screen:1.1"
allow_generated_names = false

