# ── Meta ─────────────────────────────────────────────────────────────

[meta]
version = "1.0.0"
screens_source = "screens.toml"
app_title = "Nirdosha KYC"

# Landing per role. Other modules may override or append.
[landing]
kyc_analyst = "/dashboard"
kyc_senior_analyst = "/dashboard"
kyc_mlro = "/dashboard"
compliance_officer = "/dashboard"
relationship_manager = "/customers"
auditor = "/audit/log"
platform_admin = "/config/checklists"
customer = "/onboarding/new"

