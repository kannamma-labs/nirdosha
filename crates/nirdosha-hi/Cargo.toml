[package]
name = "nirdosha-hi"
version = "0.1.0"
edition = "2024"
description = "The nirdosha hi agentic build console -- a knowledge-graph-driven generate/publish/preview loop over v2 (real Rust + nirdosha_rt macros) source. Standalone since 2026-09-16: no dependency on the native nirdosha compiler crate."

[[bin]]
name = "nirdosha-hi"
path = "src/main.rs"

[lib]
name = "nirdosha_hi"
path = "src/lib.rs"

[dependencies]
# v2 build/verify: the same in-process contract scanner `cargo nirdosha
# verify` runs, reused as a library (`v2_verify.rs`) so `verify_code`/
# `fix`/`certify_code`/`build_project`/`publish_project` can check a v2
# source string's declared-vs-actual claims without a subprocess.
cargo-nirdosha = { path = "../cargo-nirdosha" }
# `v2_verify.rs`'s `build_project`/`ensure_scratch_package` build a real
# v2 candidate against this crate as its own `nirdosha-rt` path
# dependency.
nirdosha-rt = { path = "../nirdosha-rt" }
nirdosha-audit = { path = "../nirdosha-audit" }
nirdosha-graph = { path = "../nirdosha-graph" }
# `nirdosha-hi workflow ...` (RFC 0021.b's approval/workflow runtime) --
# a real, separate service from the authoring graph above (that RFC's
# own status header: "independent delivery work, not a phase of the
# core graph service"), so it gets its own CLI subcommand family
# rather than being folded into `graph`'s MCP transport.
nirdosha-workflow = { path = "../nirdosha-workflow" }
# Parses v2 (plain Rust) candidates: `v2_verify::describe_v2_source`,
# `hi_graph::code_units_in_file`'s syntactic knowledge-graph sync, and
# the syntactic mandatory-primitive/primitive-exclusivity coverage
# checks in `hi_llm.rs`. "visit" for `syn::visit::Visit`-based call/
# construct-site walks.
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# `hi_plugin::pack_content_id` (RFC 0016 "the pack ID is the law"):
# JCS (RFC 8785) canonicalization so two byte-different encodings of
# the same logical manifest share one content-addressed identity,
# instead of hashing whatever raw bytes happened to be on disk.
serde_jcs = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
# `hi_window.rs`'s native build-mode window; `hi_api.rs`'s custom-
# protocol handler needs `linux-body` for the same reason the native
# compiler crate's own copy of this dependency did (WebKitGTK silently
# drops a POST body without it). Optional, gated by the `native-window`
# feature below (default-on, so the real `nirdosha-hi` binary's UX is
# unchanged) -- these two alone pull in the entire GTK3/WebKitGTK/soup3/
# javascriptcore/dbus/x11 native stack, which every other subcommand
# (`mcp`/`graph`/`plugin`/`ingest`/`sync`/`link`/`impact`/`serve`) never
# touches at all, and which `crates/bench` (this crate's own dependent,
# `hi_llm` only) pays for with zero benefit. Building with
# `--no-default-features` (as `crates/bench` now does) skips this whole
# stack — the actual fix for the disk/link blowup a full workspace
# build hit, not just clearing `target/` after the fact.
wry = { version = "0.57.0", features = ["linux-body"], optional = true }
tao = { version = "0.37.0", optional = true }
tiny_http = "0.12"

[features]
default = ["native-window"]
# `hi_window.rs`'s native build-mode window (`wry`+`tao`). Off means
# bare `nirdosha-hi` (no subcommand) falls back to `hi_server.rs`'s
# headless `serve` -- the same fallback `hi_window.rs`'s own module doc
# already names as "the RFC's own documented fallback for headless
# use," not a new behavior invented for this feature gate.
native-window = ["dep:wry", "dep:tao"]

# The agentic console is part of the dialect's own toolchain (the
# verifier doesn't lint itself, same precedent as `crates/nirdosha-rt`):
# its host-side caches/plugin registries legitimately use `std::sync::
# Mutex` internally, which the dialect-wide raw-lock deny (issue #77)
# would otherwise refuse. Application/dialect crates never get this
# exemption — they get `nirdosha_rt::prelude::SharedTable`/`SharedCell`.
[package.metadata.nirdosha-rt]
toolchain = true
