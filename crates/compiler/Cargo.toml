[package]
name = "nirdosha"
version = "0.1.0"
edition = "2024"
description = "A systems language designed for LLMs to write: an LL(1) grammar constrained-decodable to GBNF, no GC/data races/deadlocks/overflow, OS-process sandboxing as a language primitive."
license = "Apache-2.0"
repository = "https://github.com/kannamma-labs/nirdosha"
homepage = "https://github.com/kannamma-labs/nirdosha"
keywords = ["compiler", "llm", "ai-agents", "language", "sandboxing"]
categories = ["compilers", "command-line-utilities"]

[build-dependencies]
# `build.rs`'s own `cargo metadata` parsing (locating where a dependency
# like `windows_x86_64_msvc` ships its bundled `.lib` file -- see its
# `extra_native_libs.rs` doc comment) -- same crate, same version already
# pinned below for the compiler itself, so this adds no new dependency to
# the tree, just a second (build-time) compilation of one already there.
serde_json = "1"

[dependencies]
z3 = "0.20.2"
nirdosha-smt-core = { path = "../nirdosha-smt-core" }
# The pure isolation-anomaly-detection algorithm (Direct Serialization
# Graph), shared verbatim with `crates/runtime-kernels`'s own live FFI
# wiring (`kernel::isolation_check`) -- an ordinary root-workspace
# member (no `[workspace]` table of its own), so this and runtime-
# kernels' separate nested workspace can each depend on it via a plain
# sibling path without either becoming a foreign workspace's root the
# way a direct `path = "../runtime-kernels"` dependency would (that
# crate's own Cargo.toml comment on the real `cargo` error that shape
# hits). Backs `nirdosha check-isolation` and certificate isolation-
# violation attachment (`mcp_tools::Certificate::isolation_violations`).
nirdosha-isolation-core = { path = "../isolation-core" }
# Ed25519 signing/verification (certificate/pack signing) and the
# SHA-256 hashing `verify_pipeline.rs`'s `Certificate`/`sha256_hex` use
# -- extracted into its own crate 2026-09-16 so `crates/nirdosha-hi`
# (domain-pack signing) can share the same backend without depending on
# this crate (see that crate's own Cargo.toml for the `fips` feature
# this pulled its own copy of).
nirdosha-audit = { path = "../nirdosha-audit" }
# `pack::load_active_packs`/`active_mandatory_fns`/
# `active_protected_structs` (issue #76): reads the same `.nir/hi.db`
# `plugins` table `nirdosha-hi::hi_plugin` already writes, without
# depending on the rest of that crate (its GUI/LLM-console
# dependencies) -- see that module's own doc comment.
nirdosha-contract-core = { path = "../nirdosha-contract-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
redis = "0.27"
tiny_http = "0.12"
flate2 = "1"
postgres = "0.19"
postgres-native-tls = "0.5"
regex = "1.13.1"
rust_decimal = "1"
# Connection pooling (crates/compiler/src/pool.rs) -- r2d2 is the generic
# pool/Manager machinery, kept generic on purpose so any future pooled
# resource (not just db_connect's two backends) gets it for free; r2d2_
# sqlite/r2d2_postgres are the two Manager impls this layer needs today.
# r2d2_sqlite pinned to 0.24, NOT the latest 0.35, to match this crate's
# existing rusqlite = "0.31" pin (0.35 requires rusqlite ^0.40 -- a real
# version conflict on the shared `sqlite3` native link target, confirmed
# via crates.io's own index metadata, not guessed).
r2d2 = "0.8"
r2d2_sqlite = { version = "0.24", default-features = false, features = ["bundled"] }
r2d2_postgres = "0.18"
signal-hook = { version = "0.4", default-features = false }
# `wry`/`tao` (the native build-mode window) moved to `crates/
# nirdosha-hi` with the rest of `hi_window.rs` 2026-09-16 -- this crate
# no longer opens any window at all.

# `dist`: statically vendors Z3 (compiles it from source via `z3-src`)
# instead of dynamically linking the system `libz3` — same pattern as
# rusqlite's `bundled` feature above. Only used for release/CI binaries
# (see .github/workflows/release.yml); local dev builds keep using
# system z3 via pkg-config since the vendored build is much slower.
[features]
dist = ["z3/vendored"]
# `nirdosha-audit`'s own `fips` feature (Ed25519/SHA-256 via `aws-lc-rs`
# instead of `ring`) -- forwarded here so `cargo build --features fips`
# still works from this crate exactly as it did before crypto_backend.rs
# moved there 2026-09-16.
fips = ["nirdosha-audit/fips"]

# rfcs/0009-ui-catalog-extensibility.md Phase B's real, separately-
# compiled reference UI component -- `tests/ui_plugin_examples.rs`'s
# own dependency, mirroring how `tests/native_plugin_examples.rs`
# proves `plugin-example-native-shout`/`plugin-example-native-kv` work
# as their own READMEs claim (that pair is proven via a real `cargo
# build --release -p <crate>` + linked `.a`, since a native builtin
# crosses a real ABI boundary; this one is proven via an ordinary
# `[dev-dependencies]` edge instead, since it only hands over plain
# constants a consumer reads at its own build time — no ABI, no
# staticlib, nothing to link).
[dev-dependencies]
nirdosha-ui-plugin-example-sparkline = { path = "../ui-plugin-example-sparkline" }

# `overflow-checks = true` for release builds used to live here, back
# when this file was itself the workspace root. It's now at the real
# workspace root (../../Cargo.toml) -- Cargo only honors `[profile.*]`
# from there, silently ignoring it in a member crate's own manifest (see
# that file's comment for the full story, including the regression this
# caused after the crates/-reorg moved this file without moving that
# section along with it).
