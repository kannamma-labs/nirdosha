[package]
name = "nirdosha-macros"
version = "0.1.0"
edition = "2024"
description = "The #[contract(..)] attribute macro for the Nirdosha Rust dialect — parses contract claims, refuses local lies at compile time, and emits portable code that builds under plain rustc."
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
nirdosha-contract-core = { path = "../nirdosha-contract-core" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
toml = "0.8"
# The dialect's own toolchain: explicitly exempt from itself (the
# verifier does not lint its own implementation — see
# docs/nirdosha-rt-dialect.md §5).
[package.metadata.nirdosha-rt]
toolchain = true
