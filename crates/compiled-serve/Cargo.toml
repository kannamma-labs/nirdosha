[package]
name = "nirdosha-compiled-serve"
version = "0.1.0"
edition = "2024"
# Pins this crate to `../runtime-kernels`'s own separate workspace, not
# the repo root's — Cargo's default workspace-root discovery walks
# *upward* from a manifest with no `package.workspace` key looking for
# the nearest ancestor `[workspace]`, which would find the root
# `Cargo.toml` first purely by directory proximity, regardless of what
# `../runtime-kernels/Cargo.toml`'s own `[workspace] members` list says
# — confirmed directly: omitting this key produced `package ... is a
# member of the wrong workspace`. See that crate's own Cargo.toml
# comment for why both crates need to share one workspace, separate
# from the root one, at all.
workspace = "../runtime-kernels"

[lib]
# A real, separate library crate, not folded into `nirdosha-runtime-kernels`
# — that crate is embedded into *every* compiled binary unconditionally
# (Row 6, zero-cost-when-unused); a full HTTP server is a heavier,
# genuinely optional thing, only linked when `nirdosha build --serve`
# is used (ROADMAP B8, `rfcs/0010-landing-and-serve-exposure.md`).
name = "nirdosha_compiled_serve"

[dependencies]
# Peer dependency, not the `extern "C"`/staticlib-embedding path every
# compiled `.nir` binary uses — `docs/adr/0010-runtime-kernels-rlib-for-compiled-serve.md`
# is what makes this possible at all (`runtime-kernels` didn't produce
# a linkable `rlib` before that decision).
nirdosha-runtime-kernels = { path = "../runtime-kernels" }
serde_json = "1"
# Same version `runtime-kernels` (this same workspace) already pins for
# `nir_oidc_validate_token`/`nir_mock_issue_token`'s own JWKS parsing —
# `identity.rs` needs it too, only for encoding `AuthConfig::demo()`'s
# random secret as the base64url a JWK's `k` member requires.
base64 = "0.22"
# RFC 0016's FAPI wiring: `identity::access_token_hash`'s RFC 9449 §4.3
# `ath` claim value (`base64url(SHA-256(access_token))`). Same version
# `runtime-kernels` (this same workspace) already pins for
# `nir_dpop_verify`'s own `jkt` thumbprint -- no new provenance story.
sha2 = "0.10"
# WebAuthn support (crate::webauthn_crypto): a real, direct path
# dependency on a root-workspace crate from this separate
# (../runtime-kernels) workspace -- confirmed working via a real
# `cargo check`/`cargo nirdosha build` round-trip (2026-09-20), contrary
# to this crate's own earlier assumption (mirrored from
# nirdosha-guard-store-postgres's ADR-0013) that this workspace boundary
# blocks path dependencies outright. That ADR's finding was about the
# *opposite* direction -- a root-workspace crate depending on something
# in *this* workspace (`runtime-kernels`) -- which really does hit
# Cargo's "multiple workspace roots" error; a leaf workspace member
# reaching *up* into an unambiguous root-workspace crate, as this
# dependency does, does not hit the same failure. Needed for
# `#[nirdosha_rt::contract(effects(pure))]` on the crypto adapter's
# verification methods -- the same rustc+macro+driver enforcement every
# other guarantee in this dialect goes through, not a plain,
# uninstrumented Rust trait.
nirdosha-rt = { path = "../nirdosha-rt" }
# Raw P-256 ECDSA signature verification over WebAuthn's own
# authenticatorData||SHA256(clientDataJSON) byte layout -- not a JWT, so
# `identity.rs`'s existing jsonwebtoken-based verification path doesn't
# apply. Reuses this workspace's own already-vendored default crypto
# backend (transitively present via runtime-kernels -> jsonwebtoken's
# `ring` default) as a *direct* dependency now that this module calls
# into it itself, rather than introducing a third backend alongside
# ADR-0012's ring/aws-lc-rs pair.
ring = "0.17"
