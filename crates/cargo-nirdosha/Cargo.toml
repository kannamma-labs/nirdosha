[package]
name = "cargo-nirdosha"
version = "0.1.0"
edition = "2024"
description = "The Nirdosha compiler, Stage 1: source-scan verification of contract claims, dialect restrictions, and certificates — then delegation to plain cargo. Same source, two compilers."
license = "MIT"
publish = false

[lib]
name = "cargo_nirdosha"
path = "src/lib.rs"

[[bin]]
name = "cargo-nirdosha"
path = "src/main.rs"

[dependencies]
nirdosha-contract-core = { path = "../nirdosha-contract-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }