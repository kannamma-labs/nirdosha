[package]
name = "nirdosha-contract-core"
version = "0.1.0"
edition = "2024"
description = "Shared contract model, parsers, and scanners for the Nirdosha Rust dialect (attribute form + doc encoding)."
license = "MIT"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The dialect's own toolchain: explicitly exempt from itself (the
# verifier does not lint its own implementation — see
# docs/nirdosha-rt-dialect.md §5).
[package.metadata.nirdosha-rt]
toolchain = true
