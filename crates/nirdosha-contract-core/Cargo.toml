[package]
name = "nirdosha-contract-core"
version = "0.1.0"
edition = "2024"
description = "Shared contract model, parsers, and scanners for the Nirdosha Rust dialect (attribute form + doc encoding)."
license = "MIT"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
quote = "1"