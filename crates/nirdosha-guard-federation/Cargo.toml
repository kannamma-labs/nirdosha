[package]
name = "nirdosha-guard-federation"
version = "0.1.0"
edition = "2021"
authors = ["Nirdosha Contributors"]
description = "Federated read execution and catalog routing for Nirdosha Guard"
license = "MIT"

[dependencies]
nirdosha-guard-core = { path = "../nirdosha-guard-core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
