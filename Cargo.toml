[workspace]
resolver = "2"
# Native runtime adapters depend on this separate build workspace. Explicit
# exclusion keeps Cargo from auto-enrolling the path dependency as a member.
exclude = ["crates/runtime-kernels", "crates/compiled-serve"]
members = [
    # `crates/compiler` (the original interpreted `.nir` language) was
    # deleted 2026-09-20 -- deprecated in favor of the v2 Rust dialect
    # below (docs/ROADMAP.md's 2026-09-17 note; see
    # docs/V2_MIGRATION_ROADMAP.md for how this repo's own frozen copy
    # relates to the still-actively-developed native compiler product
    # in a separate repository). `crates/grammar_export` and
    # `crates/grammar_check` were deleted alongside it -- both existed
    # solely to validate that deleted grammar.
    #
    # The `hi` agentic build console, extracted out of `crates/compiler`
    # 2026-09-16 so it has no dependency on the native `.nir` compiler
    # crate at all -- every "does this v2 candidate build/describe/
    # verify" question goes through `nirdosha-hi`'s own `v2_verify.rs`
    # (real `cargo build` + `cargo-nirdosha`), never the native parser.
    "crates/nirdosha-hi",
    "crates/nirdosha-graph",
    "crates/nirdosha-workflow",
    # Shared Ed25519 signing + tamper-evident audit-log primitives --
    # used by `crates/nirdosha-hi` (the self-repair loop's hint-cache
    # audit trail); also once used by the now-deleted `crates/compiler`
    # (certificate/pack signing), which is why it was extracted as its
    # own crate rather than living inside `nirdosha-hi`.
    "crates/nirdosha-audit",
    # RFC 0023: store-agnostic access-control IR and invariants.
    "crates/nirdosha-guard-core",
    # RFC 0026: vendor-free observed-lineage types, collector, projection,
    # and GraphStore port — plus the composition/query proc-macros and the
    # two GraphStore drivers (embedded + remote).
    "crates/nirdosha-lineage",
    "crates/nirdosha-lineage-macros",
    "crates/nirdosha-lineage-store-embedded",
    "crates/nirdosha-lineage-store-remote",
    # RFC 0023 §1C: federated reads, catalog routing, and budget coordination.
    "crates/nirdosha-guard-federation",
    # RFC 0023 macros: policy!, #[dataset], #[classify], etc.
    "crates/nirdosha-guard-macros",
    # RFC 0023 §1C.3 / RFC 0024: first-class guarded MCP surface for agents.
    "crates/nirdosha-guard-mcp",
    # RFC 0023/0025 substrate: catalog record registry (linkme slices),
    # module interconnection contract (GuardClient, StoreDriver SPI,
    # guarded_apply), and the V-pass / conformance verify engine.
    "crates/nirdosha-guard-registry",
    "crates/nirdosha-guard-mic",
    "crates/nirdosha-guard-verify",
    # Real Postgres StoreDriver (write path): pooled + TLS-by-default
    # connection, RLS via session variables, honest FilterNodeKind
    # manifest — RFC 0026 checklist's "production store drivers" line.
    "crates/nirdosha-guard-store-postgres",
    # RFC 0026 §14: LineageSink federation drivers (JSONL file + HTTP batch),
    # satisfying the two-driver rule for the sink port.
    "crates/nirdosha-lineage-sink-jsonl",
    "crates/nirdosha-lineage-sink-http",
    # RFC 0025 §8 domain drivers (Plan Phase 13): the missing StoreDriver-
    # adjacent ports the RTM ecosystem RFC declares but nothing in the
    # workspace implemented -- each follows the same one-honest-driver
    # pattern as nirdosha-guard-store-postgres above.
    "crates/nirdosha-screening-list-fixture",
    "crates/nirdosha-scoring-model-onnx",
    # Pure, dependency-light transaction-isolation-anomaly detection
    # (the Direct Serialization Graph algorithm), shared verbatim by
    # `crates/runtime-kernels` (the live FFI-hooked path, via its own
    # separate nested workspace's own path dependency on this same
    # crate -- see `crates/runtime-kernels/Cargo.toml`'s own comment on
    # why it can't join *this* workspace, mirroring `compiled-serve`'s
    # identical reasoning); also once used by the now-deleted
    # `crates/compiler` (`nirdosha check-isolation` and certificate
    # isolation-violation attachment). No `[workspace]` table of its
    # own, so it stays an ordinary member here, not a workspace root
    # the way `runtime-kernels`/`compiled-serve` had to become to solve
    # the reverse problem.
    "crates/isolation-core",
    "crates/presence-gateway",
    # rfcs/0008-native-plugin-abi-widening.md Phase 1/4: the first two
    # real, *compiled-path* reference plugins, built against
    # `NativePluginBuiltin` directly (a plain `#[no_mangle] extern "C"`
    # symbol, not the deleted interpreter's `PluginBuiltin` trait) — see
    # each crate's own README for the plugin-author and app-author
    # sides. Their automated "compiles and the real binary runs
    # correctly" proof (`crates/compiler/tests/native_plugin_examples.rs`)
    # went away with `crates/compiler` itself (2026-09-20) -- these
    # crates still compile standalone, but linking their staticlib output
    # into a real native binary has no consumer left in this repo (v2 has
    # no AOT codegen to link into). Not deleted: this is real,
    # still-wanted functionality (v2 needs its own answer for
    # third-party/native plugin support) with no v2-native port built yet
    # -- tracked as an open item in `docs/V1_CAPABILITY_PORT_MAP.md`
    # rather than lost. Kept as members so they keep compiling and
    # bit-rotting less while that port is pending.
    "crates/plugin-example-native-shout",
    "crates/plugin-example-native-kv",
    # rfcs/0011-uniform-service-provider-model.md Phase 8: the RFC's own
    # closing checklist item -- one real, shipped `call`-shape plugin,
    # proving Phases 3-7's plugin-provider machinery works end to end
    # with real compiled/linked/executed code, not just typechecked
    # `NativePluginBuiltin` metadata. See its own README; its
    # `crates/compiler/tests/native_plugin_examples.rs` proof is gone
    # along with that crate -- same "not deleted, pending a v2 port"
    # status as the two crates above, same tracking doc.
    "crates/plugin-example-native-authed-http",
    # rfcs/0009-ui-catalog-extensibility.md Phase B's real reference UI
    # component -- a genuinely separate crate (not inline Rust in a
    # test file) contributing a `layout { ... }` widget kind. See its
    # own README; its `crates/compiler/tests/ui_plugin_examples.rs`
    # proof is gone along with that crate, and its own consumer-side
    # example (`nirdosha::ui_plugin::NativeUiComponent`) named a type
    # that lived in `crates/compiler` and is gone too -- same "not
    # deleted, pending a v2 port" status, same tracking doc.
    "crates/ui-plugin-example-sparkline",
    # `crates/bench` (2026-09) -- nirdosha-master-plan.md Part 3 Sprint 2's
    # "Benchmark harness v1", rebuilt from nothing (the original,
    # interpreter-era `crates/bench` was removed for the same reason the
    # six interpreter-era `plugin-example-*` crates further below were:
    # it scored an LLM-generated program's *interpreted* result value, a
    # mechanism that no longer exists). Repointed to v2 2026-09-20:
    # `nirdosha_hi::v2_verify::verify_v2_source`'s own in-process verdict
    # decides pass/fail (`cargo build` + `cargo-nirdosha`'s contract
    # scanner), the same check `nirdosha_hi::hi_llm`'s own self-repair
    # loop already gates every attempt on -- never a second, bench-local
    # notion of "correct" that could drift from what the compiler itself
    # says. v2 has no SMT/Z3 proof-discharge pipeline yet (unlike the
    # deleted `crates/compiler`'s `nirdosha certify`) -- tracked as an
    # open item in `docs/V1_CAPABILITY_PORT_MAP.md`, not silently
    # dropped.
    "crates/bench",
    # The original six interpreter-era `plugin-example-*` crates,
    # `plugin-support`, and `plugin-examples` stay removed: each depended
    # entirely on the interpreter (interpreted plugin dispatch via
    # `PluginBuiltin`/`PluginFn`) -- a mechanism that no longer exists
    # now that the interpreter is gone. A real MySQL/Cassandra/ActiveMQ/
    # Neo4j/HBase plugin, ported onto the compiled-path ABI above instead
    # of the deleted trait, is the real remaining proof rfcs/0008 Phase 4
    # names -- tracked in `docs/V1_CAPABILITY_PORT_MAP.md`, not done.

    # ── The Nirdosha Rust dialect (Stage 1) ──────────────────────────────
    # To the external world, Nirdosha-dialect code is just another Rust
    # program: it compiles and runs under plain `cargo` with zero
    # Nirdosha tooling. Hand the same source to the Nirdosha compiler
    # (`cargo nirdosha build`) and the contract claims riding in its
    # attributes/doc comments stop being comments and become checks —
    # lying becomes a build error. See docs/nirdosha-rt-dialect.md for
    # the design and the two demo crates below for the story.
    "crates/nirdosha-contract-core",
    "crates/nirdosha-smt-core",
    "crates/nirdosha-macros",
    "crates/nirdosha-rt",
    "crates/cargo-nirdosha",
    # Stage 2: the rustc driver — MIR-level interprocedural effects
    # verification. Nightly + rustc-dev only; the driver is invoked as
    # RUSTC_WORKSPACE_WRAPPER by `cargo nirdosha build --deep` and is a
    # pass-through for crates without Nirdosha contracts.
    "crates/nirdosha-driver",
    "examples/rt-payroll",
    "examples/rt-payroll-lying",
    "examples/rt-payroll-pure-chain",
    "examples/nirdosha-v2-corpus",
    # v2 dialect: real-time transaction monitoring vertical slice
    # (ingestion -> RFC 0023 data guard -> policy engine -> alerts -> UI),
    # one .nir file that is a plain Rust program under both compilers.
    "examples/rtm",
]

# Rust's own integer-overflow panic is `nirdosha`'s only runtime guard for
# i64 arithmetic (there's no dynamic `OutOfRange` check for it, see
# `scalar_binop`/`eval_binary` in crates/compiler/src/interpreter.rs) --
# `spawn`/`join` catches that panic via `catch_unwind` and reports
# `ThreadPanicked`. Cargo's default release profile disables overflow
# checks, which would silently make every distributed `nirdosha` binary
# wrap i64 overflow instead of erroring -- directly contradicting the
# project's overflow-safety guarantees. Keep this on in release builds.
#
# Must live HERE, at the workspace root -- Cargo only honors `[profile.*]`
# from the root manifest, silently ignoring the same section in a member
# crate's own Cargo.toml (with a build-time warning, easy to miss). This
# setting used to live in crates/compiler/Cargo.toml, back when that file
# was itself the workspace root; the `crates/`/`docs/` reorg moved it under
# a real workspace without moving this section along with it, silently
# turning overflow-checks off in every `--release` build since -- caught by
# `tests/concurrency.rs::a_panic_inside_a_spawned_function_surfaces_as_
# thread_panicked` failing in `--release` (it passed in plain `cargo test`,
# which defaults to debug-mode overflow panics regardless of this setting).
[profile.release]
overflow-checks = true
