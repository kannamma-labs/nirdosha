# ============================================================================
# menus.toml — helpdesk demo role→menu→route register.
# Consumed at compile time by `app_shell_from_toml!` (generated into
# src/app_shell.nir) and by the generator's own landing/boot wiring.
# ============================================================================

[meta]
version = "1.0.0"
screens_source = "screens.toml"
app_title = "Helpdesk (generated demo)"
app_name = "helpdesk"
org_name = "Nirdosha"
environment_name = "local"

# Post-login landing per role (feeds login!'s `landing:` fn)
[landing]
Agent = "/tickets"
Admin = "/dashboard/ops"

[fallbacks]
forbidden = { redirect = "/login", preserve_target = true }
not_found = { redirect = "/login" }

[[group]]
id = "work"
label_key = "nav.group.work"
order = 10

[[group]]
id = "collab"
label_key = "nav.group.collab"
order = 20

[[group]]
id = "admin"
label_key = "nav.group.admin"
order = 30

[[menu]]
id = "nav.tickets"
label_key = "nav.tickets"
group = "work"
screen_id = "3.1"
route = "/tickets"
guard = { action = "read", resource = "ticket" }
roles = ["Agent", "Admin"]
order = 10

