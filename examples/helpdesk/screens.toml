# ------------------------------------------------------------ M3 Tickets (2)
[[screen]]
id = "3.1"
name = "Tickets"
module = "M3"
archetype = "crud_screens"
combo = []
roles = ["Agent:R/W", "Admin:R/W"]
datasets = ["PG.tickets"]
blocked_by = []
stage = "built"
file = "examples/helpdesk/src/screens/m03_tickets.nir"
codegen = { template = "crud_screens", mount_symbol = "mount_tickets", route_path = "/tickets", generated_files = ["src/screens/m03_tickets.nir"] }
data_binding = { entities = ["Ticket"], primary_key = "ticket_id", guard = { table = "ticket_table", purpose = "Operations" }, fields = [
    { name = "title", type = "String" },
    { name = "priority", type = "String" },
    { name = "status", type = "String" },
    { name = "body", type = "String" },
] }
policy = { purpose = "Operations", allowed_actions = ["read", "create", "update"] }
parameters = { access_create = 'requires role "Agent"', access_read = 'requires role "Agent"', access_update = 'requires role "Agent"', access_delete = 'public', create_fields = ["ticket_id", "title", "priority", "body"], update_fields = ["status", "priority"] }
notes = "the single write surface for Ticket; guard owns field masking + required/forbidden fields"

