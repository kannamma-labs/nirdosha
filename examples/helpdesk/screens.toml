id = "1.1"
name = "Login"
module = "M1"
archetype = "login"
combo = []
roles = ["AllRoles:R"]
datasets = ["IDP.users_file"]
blocked_by = []
stage = "built"
file = "examples/helpdesk/src/app_shell.nir"
codegen = { template = "login", mount_symbol = "mount_login", route_path = "/login", generated_files = ["src/app_shell.nir"] }
parameters.demo_users = [
    { username = "sam", password = "agent123", roles = ["Agent"] },
    { username = "ada", password = "admin123", roles = ["Admin", "Agent"] },
    { username = "vic", password = "viewer123", roles = ["Viewer"] },
]
notes = "mode: demo — fixture-grade auth, disclosed as such; production mode reads NIRDOSHA_LOGIN_USERS"

