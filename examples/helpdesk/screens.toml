# ============================================================================
# screens.toml — helpdesk demo screen register (v2 from day one).
#
# This is the greenfield proof of "the register is the source of truth":
# `cargo nirdosha generate-screens` reads THIS file + menus.toml and emits
# the whole `src/*.nir` tree. A screen marked `built` here must appear in
# the generated code; an archetype with no generator template must be
# marked `blocked` with `blocked_by = ["archetype:<name>"]`. There is no
# third state and no hand-maintained copy of any of this.
#
# Guard posture (see docs/VALUES.md): the guard is the single authority
# for all data decisions. Every entity a generated screen touches must
# have a `data_binding.guard` somewhere in this register — a screen that
# touches an unguarded entity is a generator error, not a runtime risk.
# The `access_*` fields are vestigial route metadata (OpenAPI docs) once
# `guard:` is present: guard-mode routes are `*_with_auth` and the
# synthesized `guard_policy!` records decide who sees what.
# ============================================================================

[metadata]
schema = "nirdosha.screen-register/v2"
register_id = "helpdesk"
version = "1.0.0"
total_screens = 11
canonical_order = "module_then_id"
codegen_profile = "web-default"
generator_version = "nirdosha-screen-codegen/1"
default_timezone = "UTC"
default_locale = "en"

