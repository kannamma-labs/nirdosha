# ============================================================================
# screens.toml — AWCC Revenue Assurance (RA) screen register (definitive, 152 screens)
# Consumed by tests/verify_screen_inventory.rs
#
# Domain:  AWCC (Afghan Wireless Communication Company) Revenue Assurance product.
#          Covers CDR/usage reconciliation, billing accuracy, interconnect & roaming,
#          VAS/digital revenue, leakage & margin, ATRA regulatory reporting, and
#          adjacent fraud-overlap surfaces surfaced to RA — not the fraud product itself.
#
# stage:    built     = rendered today (file must exist)
#           emittable = all 3 ingredients present; screen not yet written
#           interim   = partial version shippable now (crud/table), full fidelity blocked
#           blocked   = nothing shippable until blocked_by closes
#           delegated = owned by external system (IdP)
#
# roles:    "<Role>:R" | "<Role>:R/W" | "<Role>:W"
#          PascalCase logical roles — runtime idents minted by app_shell!.
#          RA product roles:
#            RaAnalyst         (L1 investigator — CDR discrepancies, leak cases)
#            RaLead            (L2 team lead — four-eyes approver, escalations)
#            FinanceController (L3 — final ATRA signer, MLRO-equivalent)
#            OpsEngineer       (real-time wall, holds, intervention queue)
#            PolicyEngineer    (rule/threshold/model author)
#            Admin             (system & ops admin)
#            Auditor           (read-only auditor portal)
#            QaReviewer        (QA sampling & scorecards)
#            CsAgent           (CS transaction status lookup — 4 fields only)
#            RetailLiaison     (business customer status — single field)
#            McpCopilot        (AI copilot panel; no menus; tools-only surface)
#            RegulatorViewer   (ATRA inspector — scoped delegation view)
#
# datasets: PG.* RDBMS | RD.* refdata | AC.* audit chain | GR.* graph projections
#           K.* kafka topics | L.* sanctions/watchlist store | O.* object storage
#           CATALOG.* compiled metadata | RUNTIME.* guard runtime | IDP.* identity
#           GW.* gateways | STATIC.* signed build docs | EXT.* external integrations
# blocked_by: ticket:T-xx | dataset:<id> | archetype:<name> | engine:<name>
#             integration:<name> | external:<name> | phase:<x>
# ============================================================================

