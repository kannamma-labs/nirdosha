# ============================================================================
# screens.toml — RTM screen register (definitive, 152 screens)
# Consumed by tests/verify_screen_inventory.rs
#
# stage:    built     = rendered today (file must exist)
#           emittable = all 3 ingredients present; screen not yet written
#           interim   = partial version shippable now (crud/table), full fidelity blocked
#           blocked   = nothing shippable until blocked_by closes
#           delegated = owned by external system (IdP)
#
# roles:    "<Role>:R" | "<Role>:R/W" | "<Role>:W"
# datasets: PG.* RDBMS | RD.* refdata | AC.* audit chain | GR.* graph projections
#           K.* kafka topics | L.* sanctions list store | O.* object storage
#           CATALOG.* compiled metadata | RUNTIME.* guard runtime | IDP.* identity
#           GW.* gateways | STATIC.* signed build docs | EXT.* external integrations
# blocked_by: ticket:T-xx | dataset:<id> | archetype:<name> | engine:<name>
#             integration:<name> | external:<name> | phase:<x>
# ============================================================================

