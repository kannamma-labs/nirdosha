# ----------------------------------------------------------------------------
# 7) Exclusions & personas
# ----------------------------------------------------------------------------
[non_menu_personas]
services = ["SvcIngest", "SvcFeatures", "SvcScoring", "SvcScreening",
            "SvcAlerts", "SvcCase", "SvcBi"]      # no menus; tool/policy surfaces only
copilot = "McpCopilot exposes MCP tools (query_records/get_options/evaluate/submit_write), not menus. Its visible surface is the copilot panel inside 3.2/4.3/5.2."

[nav_semantics]
hidden_vs_disabled = "If a role lacks screen access, the item is ABSENT (existence oracle / tipping-off rule). Never render grayed."
stage_gating = "item visible iff screens.stage ∈ {built} or (stage_min=interim AND stage ∈ {interim, built}). emittable/blocked/delegated ⇒ hidden."
badge_awareness = "badge counts come from guarded aggregates; a badge the role can't drill into must not exist (V9)."
ordering = "order is per-group; 5 first for approver-heavy roles (approvals pinned via landing)."
shortcuts = { g_a = "/alerts", g_c = "/cases", g_s = "/sar", g_p = "/approvals", ctrl_k = "omnibar" }
i18n = "label_key resolves via PG.notif_template/locale tables (18.6); en defaults compiled in."
env_gates = "env field: omit = all environments; demo items hard-hidden in prod (V-rule bonus)."