# ============================================================================
# menus.toml — Role→Menu→Route register. Companion to screens.toml.
# Consumed by: app_shell! (nav), landing! (post-login), tests/verify_screen_inventory.rs
#
# Cross-file invariants (enforced by verify):
#   V1  every menu.screen_id / route.screen_id exists in screens.toml
#   V2  menu.roles ⊆ screens.roles for that screen_id
#   V3  stage(screen_id) >= stage_min, else item hidden (no dead links)
#   V4  every human role in screen.roles can REACH the screen: nav item OR reach_via chain
#   V5  every route.guard{action,resource} resolves to an existing guard_policy! record
#       (this is the T-10 "public must reference guard:" probe input)
#   V6  route paths unique; param names in {} defined
#   V7  SAR routes absent from CsAgent/RmUser/McpCopilot visibility (tipping-off:
#       absence, never disabled-state)
#   V8  landing keys ⊆ human roles; every role lands on a route it can guard-read
#   V9  badge.source must be a declared guarded aggregate (badge = surface, not chrome)
#   V10 delegated screens (stage=delegated) never appear anywhere in this file
# ============================================================================

[meta]
version = "1.0.0"
screens_source = "screens.toml"
route_style = "kebab-case; list=plural noun; detail=/noun/{id}; action=/noun/{id}/{verb}"
roles_note = "PascalCase logical roles here; app_shell! emission maps to runtime role idents (T-10 fixes snake_case blocker). Service principals (svc:*, McpCopilot as caller) get NO menus — see [non_menu_personas]."

# ----------------------------------------------------------------------------
# 1) Post-login landing per role — feeds landing! macro (RFC 0022 §4)
# ----------------------------------------------------------------------------
[landing]
Analyst         = "/dashboard/my-day"
ComplianceLead  = "/approvals"          # leads live in the inbox
Mlro            = "/sar"
OpsAnalyst      = "/holds"
QaReviewer      = "/qa"
PolicyEngineer  = "/rules/windows"
Admin           = "/ops/pipeline-health"
Auditor         = "/audit/chains"
CsAgent         = "/cs/lookup"
RmUser          = "/rm/customers"
RegulatorViewer = "@dynamic:delegation_scope"   # nav + landing generated from minted scope (V8 waives static check)

# Unauthorized / deep-link-to-forbidden behavior
[fallbacks]
forbidden    = { redirect = "/denied", screen_id = "1.6", preserve_target = true }  # logged for unlock-req context
not_found    = { redirect = "/denied?code=404" }
session_dead = { redirect = "/login?reason=session" }

# ----------------------------------------------------------------------------
# 2) Shell variants (21.1 auditor watermark portal; 21.2 regulator scope)
# ----------------------------------------------------------------------------
[[shell_variant]]
id = "auditor_portal"
screen_id = "21.1"
roles = ["Auditor"]
watermark = "AUDIT READ-ONLY · {user} · {ts}"
nav = "restricted_to_auditor_items"     # variant renders only items whose roles==[Auditor]
chrome_overrides = { omnibar = false, bell = false, tasks = false }

[[shell_variant]]
id = "regulator_inspection"
screen_id = "21.2"
roles = ["RegulatorViewer"]
nav_source = "@dynamic:delegation_scope"   # items minted per §9.4 exact-scope; never static
watermark = "REGULATORY INSPECTION · recorded session"
chrome_overrides = { omnibar = false, bell = false, tasks = false, export = false }

# ----------------------------------------------------------------------------
# 3) Chrome — app_shell! top bar (not group nav)
# ----------------------------------------------------------------------------
[[chrome]]
id = "omnibar"
screen_id = "5.1"
render = "topbar.left"
guard = { action = "read", resource = "transaction" }
roles = ["Analyst", "ComplianceLead", "OpsAnalyst", "QaReviewer", "PolicyEngineer"]
notes = "global entity search; Ctrl+K"

[[chrome]]
id = "bell"
screen_id = "16.1"
render = "topbar.right"
route = "/notifications"
guard = { action = "read", resource = "notification" }
badge = { source = "PG.notification", filter = "user_id=me AND read=false", cap = 99 }
roles = ["AllHuman"]

[[chrome]]
id = "my_tasks"
screen_id = "16.4"
render = "topbar.right"
route = "/tasks"
guard = { action = "read", resource = "case_task" }
badge = { source = "PG.case_task", filter = "assignee=me AND due<=today", cap = 99 }
roles = ["AllHuman"]

[[chrome]]
id = "saved_views"
screen_id = "2.7"
render = "topbar.left"
route = "/preferences/saved-views"
guard = { action = "read", resource = "saved_view" }
roles = ["AllHuman"]

[[chrome]]
id = "profile"
screen_id = "22.1"
render = "avatar_menu"
route = "/preferences/profile"
guard = { action = "read", resource = "user_profile", filter = "subject_scope" }
roles = ["AllHuman"]
children = [
  { label_key = "chrome.about", screen_id = "22.3", route = "/about" },
  { label_key = "chrome.support", screen_id = "22.2", route = "/help/support" },
]

