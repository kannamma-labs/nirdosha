schema: rfc0029-influence-review-symbolic-v1
compact_grammar:
  node: "<node_id>:<NodeKind>"
  edge: "<source_id>-<EdgeKind>-<target_id>"
  qualified_result: "<result_kind>:<value>"
  rule: "All tokens are exact case-sensitive identifiers from Revision 1; no omitted token has semantics."
lossless_expansion:
  profile: "<name> expands to profile:rfc0029:<name>:candidate-v1"
  bundle: "bundle:test:v1 expands to {id: bundle:rfc0029-fixtures, version: 1, hash: symbolic:bundle-rfc0029-fixtures-v1}"
  node_identity: "Each node token <id>:<kind> expands using fixture_id as namespace; stable_id is node:<fixture_id>:<id>."
  ModelInvocation: "{deployment_id: model:<fixture_id>:v1, receipt_id: receipt:<fixture_id>:<id>:v1}"
  Fact: "{authority_class: profile_authority, type_id: fact:<fixture_id>:<id>, version: 1} plus fixture.fact_provenance.<id> when present (produced_by_model, produced_by_deployment, valid_until, revoked, authorized_consumers)."
  fact_requirement: "Decision gains fixture.fact_requirement.<id> attributes verbatim (required_model, required_deployment) when present; checked against a reachable Fact's fact_provenance by a dedicated evaluator, never by compute_influence."
  Transform: "{transform_id: transform:<fixture_id>:<id>, version: 1}"
  Rule: "{rule_id: rule:<fixture_id>:<id>, bundle_hash: symbolic:bundle-rfc0029-fixtures-v1}"
  CandidateSet: "{candidate_type: candidate:<fixture_id>:<id>}"
  Presentation: "{surface_id: surface:<fixture_id>:<id>, version: 1}"
  Review: "{review_contract_id: <fixture.review_contract-or-assertion.contract>, mode: mode_from_contract_catalog}"
  AuthorityAssertion: "Expanded from fixture assertion plus authority/contract catalogs; assertion ID is node stable_id."
  Decision: "{decision_class: decision:<fixture_id>:<id>}"
  Obligation: "{obligation_type: obligation:<fixture_id>:<id>}"
  Capability: "Expanded only from fixture.capabilities.<node_id>; absence is an invalid fixture. Expected output never supplies input."
  Effect: "Expanded only from fixture.effects.<node_id>; absence is an invalid fixture. Every entry contains effect_id and reversibility_class."
  Evidence: "{evidence_type: evidence:<fixture_id>:<id>}"
  edge: "Token expands to {source: node:<fixture_id>:<source>, kind: EdgeKind, target: node:<fixture_id>:<target>}."
  evaluation: "Boolean shorthand expands to the matching predicate definition and an evaluation with evaluator authority:fixture-review-evaluator:v1, input commitment symbolic:<fixture_id>:<predicate>:inputs, evidence commitment symbolic:<fixture_id>:<predicate>:evidence, evaluated_at 2026-09-27T00:00:00Z, valid_until 2026-09-28T00:00:00Z, revoked false. stale:Deny sets valid_until 2026-09-26T00:00:00Z and failure_behavior Deny."
  admission_policy: "A fixture declaring fixture.capabilities.<id>.effect_class or fixture.effects.<id>.effect_id gains input.parameters.admission_policy = {effect_class, maximum_model_level: effect_authority_ceilings[effect_class]} — the per-effect-class maximum authority tier RFC 0029.a §13.2 requires every model-influenced path to declare. Until 2026-09-27 this table existed only in the generator, not here; that was a real completeness gap in this file's own lossless_expansion claim, found by an independent second implementation and closed by moving the table below into the normative source."

# Per-effect-class maximum model-authority tier (RFC 0029.a §13.2). Every
# effect_class referenced by any fixture's capabilities/effects block below
# MUST have an entry here — this is normative fixture data, not a generator
# implementation detail, and every entry must be justified by the profile
# tabletop or canonical-vectors write-up that introduced that effect_class.
effect_authority_ceilings:
  application.reject: Recommend
  clinical.alert: Recommend
  medication.administer: None
  order.sign: Draft
  work_order.approve: Recommend
  product.quarantine: ExecuteReversible
  machine.restart: Approve
  settlement.approve: Recommend
  claim.approve.bounded: Approve
  payment.issue: None
  funds.reserve: None
  shipment.hold: ExecuteReversible
  cargo.release: Recommend
  wire.transfer.hold: Recommend

defaults:
  bundle: bundle:test:v1
  dependencies: []
  review_contract: null
  final_authority: null
  review: not_required
  capability: not_issued
  invalidation: none

equivalence_groups:
  - id: g-recommend-1
    fixtures: [EQ1A, EQ1B]
    normalized:
      nodes: [m:ModelInvocation, d:Decision]
      edges: [m-Recommend-d]
  - id: g-prioritize-1
    fixtures: [EQ2A, EQ2B]
    normalized:
      nodes: [m:ModelInvocation, p:Presentation, v:Review]
      edges: [m-Rank-p, p-Attention-v]
  - id: g-draft-human-1
    fixtures: [EQ3A, EQ3B]
    normalized:
      nodes: [m:ModelInvocation, v:Review, a:AuthorityAssertion, d:Decision]
      edges: [m-DraftArtifact-v, v-HumanInput-a, a-AssertDecision-d]
      assertion: {covered_input_origins: [m, v], covered_model_paths: [m], covered_targets: [d], contract: rc-independent-pass}
  - id: g-shadow-1
    fixtures: [EQ4A, EQ4B]
    normalized:
      nodes: [m:ModelInvocation, e:Evidence]
      edges: [m-ObserveOnly-e]
      observe_certificate: cert-shadow-current

authority_catalog:
  clinician: {id: authority:clinician, version: 1}
  compliance-reviewer: {id: authority:compliance-reviewer, version: 1}
  maintenance-supervisor: {id: authority:maintenance-supervisor, version: 1}
  adjuster: {id: authority:adjuster, version: 1}
  bank: {id: authority:bank, version: 1}
  customs-authority: {id: authority:customs-authority, version: 1}
  customs-officer: {id: authority:customs-officer, version: 1}

predicate_definitions:
  authenticated: {id: predicate:authenticated, version: 1, kind: Qualification, expression: "subject.authenticated == true", input_schema: [subject.authenticated:bool], result_type: Bool, authority: authority:fixture-review-policy}
  acknowledged: {id: predicate:acknowledged, version: 1, kind: ExplicitAction, expression: "review.acknowledged == true", input_schema: [review.acknowledged:bool], result_type: Bool, authority: authority:fixture-review-policy}
  authority: {id: predicate:authority, version: 1, kind: Authority, expression: "reviewer.authorized == true", input_schema: [reviewer.authorized:bool], result_type: Bool, authority: authority:fixture-review-policy}
  qualification: {id: predicate:qualification, version: 1, kind: Qualification, expression: "reviewer.qualified == true", input_schema: [reviewer.qualified:bool], result_type: Bool, authority: authority:fixture-review-policy}
  independence: {id: predicate:independence, version: 1, kind: Independence, expression: "reviewer.independent == true", input_schema: [reviewer.independent:bool], result_type: Bool, authority: authority:fixture-review-policy}
  evidence_available: {id: predicate:evidence-available, version: 1, kind: EvidenceAvailable, expression: "evidence.available == true", input_schema: [evidence.available:bool], result_type: Bool, authority: authority:fixture-review-policy}
  evidence_accessed: {id: predicate:evidence-accessed, version: 1, kind: EvidenceAccessed, expression: "evidence.accessed == true", input_schema: [evidence.accessed:bool], result_type: Bool, authority: authority:fixture-review-policy}
  limitations_visible: {id: predicate:limitations-visible, version: 1, kind: LimitationVisible, expression: "model.limitations_visible == true", input_schema: [model.limitations_visible:bool], result_type: Bool, authority: authority:fixture-review-policy}
  explicit_action: {id: predicate:explicit-action, version: 1, kind: ExplicitAction, expression: "review.explicit_action == true", input_schema: [review.explicit_action:bool], result_type: Bool, authority: authority:fixture-review-policy}
  reason_bound: {id: predicate:reason-bound, version: 1, kind: ReasonBound, expression: "review.reason_bound == true", input_schema: [review.reason_bound:bool], result_type: Bool, authority: authority:fixture-review-policy}
  override: {id: predicate:override, version: 1, kind: OverrideAvailable, expression: "review.override_available == true", input_schema: [review.override_available:bool], result_type: Bool, authority: authority:fixture-review-policy}
  escalation: {id: predicate:escalation, version: 1, kind: EscalationAvailable, expression: "review.escalation_available == true", input_schema: [review.escalation_available:bool], result_type: Bool, authority: authority:fixture-review-policy}
  capacity: {id: predicate:capacity, version: 1, kind: CapacityHealthy, expression: "review.capacity_healthy == true", input_schema: [review.capacity_healthy:bool], result_type: Bool, authority: authority:fixture-review-policy}
  independent_choice: {id: predicate:independent-choice, version: 1, kind: IndependentOutcomeChoice, expression: "review.independent_choice == true", input_schema: [review.independent_choice:bool], result_type: Bool, authority: authority:fixture-review-policy}
  sampling: {id: predicate:sampling, version: 1, kind: SamplingAssigned, expression: "review.sampling_assigned == true", input_schema: [review.sampling_assigned:bool], result_type: Bool, authority: authority:fixture-review-policy}

review_contract_catalog:
  rc-ack: {id: review-contract:ack, version: 1, mode: Acknowledgement, predicates: [authenticated, acknowledged], authority: authority:fixture-review-policy}
  rc-bounded: {id: review-contract:bounded, version: 1, mode: BoundedApproval, predicates: [authenticated, authority, evidence_available, explicit_action, reason_bound, override, escalation, capacity, sampling], authority: authority:fixture-review-policy}
  rc-independent: {id: review-contract:independent, version: 1, mode: IndependentDecision, predicates: [authenticated, acknowledged, qualification, authority, independence, evidence_available, evidence_accessed, limitations_visible, explicit_action, reason_bound, override, escalation, capacity, independent_choice, sampling], authority: authority:fixture-review-policy}
  rc-independent-pass: {id: review-contract:independent-pass, version: 1, mode: IndependentDecision, predicates: [authenticated, acknowledged, qualification, authority, independence, evidence_available, evidence_accessed, limitations_visible, explicit_action, reason_bound, override, escalation, capacity, independent_choice, sampling], evaluation_fixture: R5_PASS, authority: authority:fixture-review-policy}
  rc-independent-evidence-not-accessed: {id: review-contract:independent-not-accessed, version: 1, mode: IndependentDecision, predicates: [authenticated, acknowledged, qualification, authority, independence, evidence_available, evidence_accessed, limitations_visible, explicit_action, reason_bound, override, escalation, capacity, independent_choice, sampling], evaluation_fixture: R3_NOT_ACCESSED, authority: authority:fixture-review-policy}
  rc-reason-not-bound: {id: review-contract:reason-not-bound, version: 1, mode: IndependentDecision, predicates: [authenticated, acknowledged, qualification, authority, independence, evidence_available, evidence_accessed, limitations_visible, explicit_action, reason_bound, override, escalation, capacity, independent_choice, sampling], evaluation_fixture: I2, authority: authority:fixture-review-policy}
  self-review: {id: review-contract:self-review, version: 1, mode: IndependentDecision, predicates: [authenticated, acknowledged, qualification, authority, independence, evidence_available, evidence_accessed, limitations_visible, explicit_action, reason_bound, override, escalation, capacity, independent_choice, sampling], evaluation_fixture: R4_CONFLICT, authority: authority:fixture-review-policy}

observe_certificate_catalog:
  cert-shadow-current:
    boundary: {components: [decision-copy-tap, isolated-shadow-sink], protected_targets: [all-fixture-protected-targets]}
    dependency_graph_hash: symbolic:shadow-dependency-graph-v1
    model_sink: isolated-shadow-sink
    allowed_channels: [{source: decision-copy-tap, target: isolated-shadow-sink, direction: one-way}]
    forbidden_return_classes: [data, control, configuration, scheduling_priority, shared_mutable_state, credential_or_capability]
    enforcement: {mechanism_id: fixture-one-way-sandbox, version: 1, attestation: symbolic:fixture-sandbox-attestation-v1}
    shared_resources: []
    valid_from: 2026-09-27T00:00:00Z
    valid_until: 2026-09-28T00:00:00Z
    invalidation: [topology-change, policy-change, credential-change, shared-resource-change]
    unmodeled_channel_behavior: Indeterminate
  cert-shadow-stale:
    boundary: {components: [decision-copy-tap, isolated-shadow-sink], protected_targets: [all-fixture-protected-targets]}
    dependency_graph_hash: symbolic:shadow-dependency-graph-v1
    model_sink: isolated-shadow-sink
    allowed_channels: [{source: decision-copy-tap, target: isolated-shadow-sink, direction: one-way}]
    forbidden_return_classes: [data, control, configuration, scheduling_priority, shared_mutable_state, credential_or_capability]
    enforcement: {mechanism_id: fixture-one-way-sandbox, version: 1, attestation: symbolic:fixture-sandbox-attestation-v1}
    shared_resources: []
    valid_from: 2026-09-25T00:00:00Z
    valid_until: 2026-09-26T00:00:00Z
    invalidation: [topology-change, policy-change, credential-change, shared-resource-change]
    unmodeled_channel_behavior: Indeterminate

